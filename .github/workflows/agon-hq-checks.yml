name: AGON HQ checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'scripts/agon-hq-daily.ts'
      - 'tests/**'
      - 'prisma/**'
      - 'package*.json'
      - '.github/workflows/agon-hq-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      AUTH_SECRET: test-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/agon-hq-plan.test.ts
      - run: npm run build
